    <rect x="496" y="110" width="139.4" height="12" fill="#3178c6"/>
    <rect x="635.4" y="110" width="112.6" height="12" fill="#52b383"/>
    <rect x="748.0" y="110" width="53.6" height="12" fill="#f1e05a"/>

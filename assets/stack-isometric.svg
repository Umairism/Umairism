<svg xmlns="http://www.w3.org/2000/svg" width="900" height="216" viewBox="0 0 900 216" fill="none">
  <rect width="900" height="216" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="899" height="215" rx="12" stroke="#30363d"/>

  <line x1="464" y1="24" x2="464" y2="192" stroke="#21262d" stroke-width="1"/>

  <text x="32" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8b949e" letter-spacing="1.2">ARCHITECTURE &amp; CORE STACK</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">
    <rect x="32" y="56" width="400" height="36" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="48" cy="74" r="3.5" fill="#52b383"/>

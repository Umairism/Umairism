  <text x="496" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8b949e" letter-spacing="1.2">GITHUB DISTRIBUTION  ·  69 PUBLIC REPOS</text>
  <text x="496" y="72" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0f6fc">
    TypeScript &amp; Python First
  </text>
  <text x="496" y="92" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">
    Primary language breakdown across @Umairism public repos
  </text>

  <clipPath id="barClip">

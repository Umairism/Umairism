<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="78%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#16382b" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#0f2336" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topSlab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b383" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="midSlab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#8b7bff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="botSlab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b949e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="coreFrontL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b383" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="coreFrontR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b7bff" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="isoGrid" width="48" height="27.71" patternUnits="userSpaceOnUse">
      <path d="M 0 13.855 L 24 0 L 48 13.855 L 24 27.71 Z" fill="none" stroke="#21262d" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="899" height="319" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="900" height="320" fill="#0d1117"/>
    <rect width="900" height="320" fill="url(#isoGrid)"/>
    <rect width="900" height="320" fill="url(#bgGlow)"/>

    <!-- Eyebrow -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8b949e">
      <circle cx="48" cy="48" r="4" fill="#52b383">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="62" y="52" letter-spacing="1.4" fill="#c9d1d9">ISLAMABAD, PK  ·  BS CS (NUML)</text>
    </g>

    <!-- Main Typography -->
    <text x="44" y="122" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#f0f6fc" letter-spacing="-0.6">
      Muhammad Umair Hakeem
    </text>
    <text x="44" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" fill="#52b383" letter-spacing="0.2">
      Full-Stack Developer &amp; Backend Systems Engineer
    </text>
    <text x="44" y="192" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">
      Building browser dev environments, APIs, security tooling, and WebGL interfaces.
    </text>

    <!-- Stack Pills -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#c9d1d9">
      <rect x="44" y="218" width="92" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
      <text x="90" y="235" text-anchor="middle">TypeScript</text>

      <rect x="144" y="218" width="70" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
      <text x="179" y="235" text-anchor="middle">Python</text>

      <rect x="222" y="218" width="84" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
      <text x="264" y="235" text-anchor="middle">Three.js</text>

      <rect x="314" y="218" width="76" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
      <text x="352" y="235" text-anchor="middle">FastAPI</text>
    </g>

    <!-- Bottom telemetry -->
    <text x="44" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8b949e">
      69 public repos  ·  3 live portfolios  ·  open to SWE / full-stack roles
    </text>

    <!-- Vertical Axis -->
    <line x1="708" y1="32" x2="708" y2="296" stroke="#30363d" stroke-width="1" stroke-dasharray="3 4"/>

    <!-- Bottom Slab: Systems -->
    <g>
      <polygon points="590.22,224.0 708.0,292.0 708.0,308.0 590.22,240.0" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <polygon points="825.78,224.0 708.0,292.0 708.0,308.0 825.78,240.0" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <polygon points="708.0,156.0 825.78,224.0 708.0,292.0 590.22,224.0" fill="url(#botSlab)" stroke="#6e7681" stroke-width="1"/>
      <text x="610" y="246" font-family="ui-monospace, monospace" font-size="9.5" fill="#8b949e" text-anchor="end">SYSTEMS</text>
    </g>

    <!-- Middle Slab: Backend -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="5s" repeatCount="indefinite"/>
      <polygon points="604.08,182.0 708.0,242.0 708.0,258.0 604.08,198.0" fill="#102130" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1"/>
      <polygon points="811.92,182.0 708.0,242.0 708.0,258.0 811.92,198.0" fill="#0c1722" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
      <polygon points="708.0,122.0 811.92,182.0 708.0,242.0 604.08,182.0" fill="url(#midSlab)" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.1"/>
      <text x="618" y="204" font-family="ui-monospace, monospace" font-size="9.5" fill="#38bdf8" text-anchor="end">BACKEND</text>
    </g>

    <!-- Top Slab: WebGL / UI -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="4.2s" repeatCount="indefinite"/>
      <polygon points="617.93,140.0 708.0,192.0 708.0,208.0 617.93,156.0" fill="#10241c" stroke="#52b383" stroke-opacity="0.55" stroke-width="1"/>
      <polygon points="798.07,140.0 708.0,192.0 708.0,208.0 798.07,156.0" fill="#0b1a14" stroke="#52b383" stroke-opacity="0.4" stroke-width="1"/>
      <polygon points="708.0,88.0 798.07,140.0 708.0,192.0 617.93,140.0" fill="url(#topSlab)" stroke="#52b383" stroke-opacity="0.85" stroke-width="1.2"/>
      <text x="626" y="162" font-family="ui-monospace, monospace" font-size="9.5" fill="#52b383" text-anchor="end">WEBGL / UI</text>
    </g>

    <!-- Floating Wireframe Cube + Symmetric Crystal Octahedron -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="3.8s" repeatCount="indefinite"/>

      <!-- Back cube wireframe -->
      <line x1="708.0" y1="92.0" x2="756.5" y2="120.0" stroke="#8b7bff" stroke-opacity="0.32" stroke-dasharray="3 3"/>
      <line x1="708.0" y1="92.0" x2="659.5" y2="120.0" stroke="#8b7bff" stroke-opacity="0.32" stroke-dasharray="3 3"/>
      <line x1="708.0" y1="92.0" x2="708.0" y2="36.0" stroke="#8b7bff" stroke-opacity="0.32" stroke-dasharray="3 3"/>

      <!-- Inner crystal octahedron (4 visible front facets) -->
      <polygon points="708.0,52.0 656.04,92.0 708.0,122.0" fill="url(#coreFrontL)" stroke="#52b383" stroke-width="1"/>
      <polygon points="708.0,52.0 708.0,122.0 759.96,92.0" fill="url(#coreFrontR)" stroke="#38bdf8" stroke-width="1"/>
      <polygon points="708.0,132.0 656.04,92.0 708.0,122.0" fill="#112224" fill-opacity="0.72" stroke="#52b383" stroke-opacity="0.65" stroke-width="0.9"/>
      <polygon points="708.0,132.0 708.0,122.0 759.96,92.0" fill="#0f1b2b" fill-opacity="0.75" stroke="#8b7bff" stroke-opacity="0.65" stroke-width="0.9"/>

      <!-- Outer translucent wireframe cube -->
      <polygon points="708.0,36.0 756.5,64.0 708.0,92.0 659.5,64.0" fill="#ffffff" fill-opacity="0.03" stroke="#c9d1d9" stroke-opacity="0.55" stroke-width="1"/>
      <polyline points="756.5,120.0 708.0,148.0 659.5,120.0" fill="none" stroke="#c9d1d9" stroke-opacity="0.45" stroke-width="1"/>
      <line x1="708.0" y1="148.0" x2="708.0" y2="92.0" stroke="#c9d1d9" stroke-opacity="0.6" stroke-width="1"/>
      <line x1="756.5" y1="120.0" x2="756.5" y2="64.0" stroke="#c9d1d9" stroke-opacity="0.45" stroke-width="1"/>
      <line x1="659.5" y1="120.0" x2="659.5" y2="64.0" stroke="#c9d1d9" stroke-opacity="0.45" stroke-width="1"/>

      <!-- Vertex dots -->
      <circle cx="708.0" cy="92.0" r="2.5" fill="#52b383"/>
      <circle cx="756.5" cy="64.0" r="2.2" fill="#38bdf8"/>
      <circle cx="659.5" cy="64.0" r="2.2" fill="#8b7bff"/>
      <circle cx="708.0" cy="52.0" r="2.8" fill="#f0f6fc"/>
    </g>

    <!-- Local-coordinate Orbital Ring so dots stay 100% locked onto ellipse -->
    <g transform="translate(708, 136) rotate(-14)">
      <ellipse cx="0" cy="0" rx="108" ry="34" stroke="#30363d" stroke-width="1" fill="none"/>
      <circle r="3" fill="#52b383">
        <animateMotion dur="6s" repeatCount="indefinite" path="M -108,0 A 108,34 0 1,1 108,0 A 108,34 0 1,1 -108,0"/>
      </circle>
      <circle r="2.4" fill="#38bdf8">
        <animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M -108,0 A 108,34 0 1,1 108,0 A 108,34 0 1,1 -108,0"/>
      </circle>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="899" height="319" rx="12" stroke="#30363d" fill="none"/>
</svg>
